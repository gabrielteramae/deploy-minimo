# Exemplo para quando o domínio já aponta para a máquina.
# Não entra no Compose. Substitui o server de default.conf; não deixe os dois
# escutando a porta 80 com o mesmo server_name.
#
# Certificado, no servidor, fora deste repositório:
#   sudo certbot --nginx -d exemplo.com
# O plugin reescreve o conf. Este arquivo só mostra o formato esperado.
# Não commite fullchain.pem nem privkey.pem.

server {
    listen 80;
    server_name exemplo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name exemplo.com;

    ssl_certificate     /etc/letsencrypt/live/exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemplo.com/privkey.pem;

    root /var/www/deploy-minimo/current;
    index index.html;

    gzip on;
    gzip_types text/css text/plain application/javascript image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
    }
}
